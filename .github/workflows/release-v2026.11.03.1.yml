name: Release TVK69 v2026.11.03.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v2026.11.03.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f api/enp4.php
          test -f database/tvk69_recordings_comments.sql
          grep -q 'id="loginStudentId"' index.html
          grep -q 'function canEditCurrentStudent()' index.html
          ! grep -q 'verifyStdId' index.html
          ! grep -q 'sidInput' index.html
          grep -q "case 'recording-comment-add':" api/enp4.php
          grep -q 'recorded_lesson_comments' database/tvk69_recordings_comments.sql

      - name: Build ZIP package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="TVK69-v2026.11.03.1.zip"
          rm -f "$ZIP_NAME"
          zip -r -9 "$ZIP_NAME" . \
            -x '.git/*' \
            -x '.github/workflows/release-v2026.11.03.1.yml'
          sha256sum "$ZIP_NAME" | tee "$ZIP_NAME.sha256"
          unzip -t "$ZIP_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2026.11.03.1"
          ZIP_NAME="TVK69-v2026.11.03.1.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" \
              --target "${GITHUB_SHA}" \
              --title "TVK69 v2026.11.03.1" \
              --notes-file RELEASE_NOTES_v2026.11.03.md
          fi
